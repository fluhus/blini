# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Run Test Data
      run: |
        rm -fr tmp
        go install ./blini
        sh testdata/run_blini.sh
        go run ./testdata/test

    - name: Run Test Data (blini2)
      run: |
        rm -fr tmp
        go install -tags blini2 ./blini
        sh testdata/run_blini.sh
        go run ./testdata/test

    - name: Run Test Data (experimental)
      run: |
        rm -fr tmp
        go install -tags blinix ./blini
        sh testdata/run_blini.sh
        go run ./testdata/test
